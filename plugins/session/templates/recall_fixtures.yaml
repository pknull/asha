# Recall fixtures — retrieval regression checks for your own memory bundle.
#
# Each fixture is a question a future session might naturally ask, paired with
# the memory it should surface. `recall_bench.py` ranks your memories against
# each question and scores hit@k. The point is to catch retrieval *regressions*:
# a memory that used to be findable and quietly stopped being findable.
#
# Schema — questions, not keyword bags:
#
#   - q: "<a question phrased the way you would actually ask it>"
#     expect: <memory filename stem, or a learning id>
#
# `expect` must name a memory that exists in YOUR bundle (`~/.asha/learnings/`
# or a project `Memory/`). That is why this file ships EMPTY.
#
# Why empty rather than pre-populated: a fixture whose `expect` names a memory
# you do not have can never hit. It scores 0 forever, drags the baseline down,
# and — the real cost — hides genuine regressions in the fixtures that *do*
# work, because the aggregate score is already bad and stays bad. A permanently
# impossible fixture conceals exactly what this benchmark exists to detect.
# Seeding this file with another person's memory ids would do that to every
# fixture in it, on every machine but theirs.
#
# How to build your set:
#
#   1. Add one fixture in the same change whenever you inscribe a durable
#      diagnosed-failure memory. Write the question the way you would ask it
#      six months from now, having forgotten the details — not the way you
#      would grep for it.
#   2. Prefer symptom-shaped questions for diagnosed failures ("gws call
#      returns 403 after adding scope") — that is how the problem re-arrives.
#   3. Run `recall_bench.py` after memory consolidation. A drop means retrieval
#      regressed, usually because a consolidation blurred a distinctive term.
#   4. Keep every fixture scorable. If you retire the memory behind a fixture,
#      retire the fixture in the same change.
#
# Illustrative shape only — these are commented out on purpose. Uncomment
# nothing; write your own against memories you actually have.
#
#   - q: "Which host runs the media stack, and what is its address?"
#     expect: reference_home_network
#   - q: "Build fails only in CI, passes locally, no code change"
#     expect: reference_ci_env_drift
#   - q: "Should I use the vendor CLI or the MCP server for calendar work?"
#     expect: feedback_cli_over_mcp
#
# Scope: this file is the cross-project set (`~/.asha/recall_fixtures.yaml`).
# A project may keep its own at `Memory/recall_fixtures.yaml`, which takes
# precedence when present. See plugins/session/skills/memory-maintenance.

